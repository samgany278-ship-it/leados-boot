name: boot-leados-codespace
on:
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Connect and run LeadOS setup inside codespace
        env:
          GH_TOKEN: ${{ secrets.SHIPIT_TOKEN }}
        run: |
          set -e
          CS=$(cd /tmp && gh codespace list --json name --jq ".[0].name" || true)
          echo "Codespace: $CS"
          test -n "$CS"
          gh codespace ssh -c "$CS" -- 'echo CONNECTED && hostname && git -C /workspaces/LeadOS pull origin deploy/codespace || true'
          git clone --depth 1 -b deploy/codespace https://github.com/EZZ1000000000/LeadOS /tmp/leados
          gh codespace ssh -c "$CS" -- bash -s < /tmp/leados/scripts/codespace-setup.sh
          echo "=== health check:"
          gh codespace ssh -c "$CS" -- 'curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 5 http://localhost:3000/ || true'
          gh api -X PUT "user/codespaces/$CS/ports/3000" -f visibility=open
          gh api "user/codespaces/$CS/ports" --jq '.ports[] | {port, visibility, url}'
